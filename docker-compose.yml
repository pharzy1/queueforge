services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: queueforge
      POSTGRES_USER: queueforge
      POSTGRES_PASSWORD: queueforge
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U queueforge"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: .
    environment:
      DATABASE_URL: postgres://queueforge:queueforge@postgres:5432/queueforge
    ports: ["3000:3000"]
    depends_on: { postgres: { condition: service_healthy } }
  worker:
    build: .
    command: ["node", "dist/worker-main.js"]
    environment:
      DATABASE_URL: postgres://queueforge:queueforge@postgres:5432/queueforge
    depends_on: { postgres: { condition: service_healthy } }
volumes:
  postgres-data:
